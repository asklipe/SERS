[workspace]
resolver = "2"
members = [
    "crates/sers-core",
    "crates/sers-crypto",
    "crates/sers-protocol",
    "crates/sers-identity",
    "crates/sers-package",
    "crates/sers-loader",
    "crates/sers-platform",
    "crates/sers-cli",
    "crates/sers-sdk",
    "control-plane/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
sers-core = { path = "crates/sers-core" }
sers-crypto = { path = "crates/sers-crypto" }
sers-protocol = { path = "crates/sers-protocol" }
sers-identity = { path = "crates/sers-identity" }
sers-package = { path = "crates/sers-package" }
sers-platform = { path = "crates/sers-platform" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["zeroize"] }
x25519-dalek = { version = "2", features = ["zeroize"] }
hkdf = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
