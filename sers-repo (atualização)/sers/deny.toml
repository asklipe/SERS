[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
allow-workspace = true

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
# The project license is intentionally unresolved; unpublished workspace crates
# are excluded until the owner chooses and records that license.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []